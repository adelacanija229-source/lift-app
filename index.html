<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
:root{--bg:#09090F;--c1:#101018;--c2:#181824;--c3:#22222E;--b1:#2A2A3A;--b2:#3A3A50;--t1:#F0F0FF;--t2:#9898B8;--t3:#505068;--red:#FF3860;--red2:#FF6B88}
html,body{height:100%;background:var(--bg);overscroll-behavior:none}
body{font-family:'Inter',sans-serif;color:var(--t1)}
#app{min-height:100vh;background:var(--bg);padding-bottom:78px}
.mono{font-family:'Space Mono',monospace}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
.up{animation:up .3s ease both}
::-webkit-scrollbar{width:0}
/* Tab */
#tab{position:fixed;bottom:0;left:0;right:0;z-index:99;background:rgba(9,9,15,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--b1);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:5px 0}
.tb span{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.5px;color:var(--t3)}
/* Btn */
.bp{display:block;width:100%;padding:16px;background:var(--red);border:none;border-radius:14px;color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;letter-spacing:.2px;cursor:pointer;text-align:center}
.bg{display:block;width:100%;padding:15px;background:transparent;border:1.5px solid var(--b2);border-radius:14px;color:var(--t2);font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;text-align:center}
/* Card */
.cd{background:var(--c1);border:1px solid var(--b1);border-radius:18px;overflow:hidden}
/* Chip */
.ch{display:inline-flex;align-items:center;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.5px;padding:3px 8px;border-radius:6px}
/* Sheet */
.ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--c2);border:1px solid var(--b1);border-radius:22px 22px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:500px;animation:sheet .25s ease both}
</style>
</head>

function fmt(s){var m=Math.floor(s/60),sc=s%60;return(m<10?"0":"")+m+":"+(sc<10?"0":"")+sc;}
function fmtLong(t){var h=Math.floor(t/3600),m=Math.floor((t%3600)/60);if(h>0)return h+"시간 "+m+"분";if(m>0)return m+"분 "+(t%60)+"초";return t+"초";}

function saveEx(){
  try{
    var m={};
    for(var i=0;i<RD.length;i++){
      var r=RD[i];
      for(var j=0;j<r.ex.length;j++){

    }
    localStorage.setItem(SK_EX,JSON.stringify(m));
  }catch(e){}
}
function loadEx(){

    var m=JSON.parse(localStorage.getItem(SK_EX)||"null");
    if(!m)return;
    for(var i=0;i<RD.length;i++){
      var r=RD[i];
      for(var j=0;j<r.ex.length;j++){
        var v=m[r.id+":"+j];
        if(!v)continue;
        if(v.k!==undefined)r.ex[j].kg=v.k;

        if(v.t!==undefined)r.ex[j].rest=v.t;
      }
    }

}

function saveSes(){
  if(!G.ses||G.ses.fin){localStorage.removeItem(SK_SES);return;}
  try{
    var sv={rid:G.ses.r.id,xi:G.ses.xi,sn:G.ses.sn,done:G.ses.done,rest:G.ses.rest||0,el:G.ses.el,ts:Date.now()};
    localStorage.setItem(SK_SES,JSON.stringify(sv));
  }catch(e){}
}
function loadSes(){
  try{
    var sv=JSON.parse(localStorage.getItem(SK_SES)||"null");
    if(!sv)return null;
    /* 12시간 지난 세션은 폐기 */
    if(sv.ts&&Date.now()-sv.ts>43200000){localStorage.removeItem(SK_SES);return null;}
    var r=null;for(var i=0;i<RD.length;i++){if(RD[i].id===sv.rid){r=RD[i];break;}}
    if(!r)return null;
    /* 자리 비운 시간만큼 보정 */
    var away=sv.ts?Math.floor((Date.now()-sv.ts)/1000):0;
    var rest=Math.max(0,(sv.rest||0)-away);
    var el=(sv.el||0)+away;
    return{r:r,xi:sv.xi,sn:sv.sn,done:sv.done,rest:rest,ri:null,ei:null,el:el,fin:false};
  }catch(e){return null;}
}function tot(){var t=0;for(var k in G.ct)t+=G.ct[k];return t;}
function wkCnt(){
  var now=new Date(),mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7));mon.setHours(0,0,0,0);
  var c=0;for(var i=0;i<G.hist.length;i++){if(new Date(G.hist[i].date)>=mon)c++;}
  return c;
}
function streak(){
  if(!G.hist.length)return 0;
  var seen={};
  for(var i=0;i<G.hist.length;i++){seen[new Date(G.hist[i].date).toDateString()]=1;}
  var days=[];for(var d in seen)days.push(new Date(d));
  days.sort(function(a,b){return b-a;});
  var st=0,today=new Date();today.setHours(0,0,0,0);
  for(var i=0;i<days.length;i++){
    var d=new Date(days[i]);d.setHours(0,0,0,0);
    var diff=Math.round((today-d)/86400000);
    if(diff===i||diff===i+1)st++;else break;
  }
  return st;
}
function ctMap(){var m={};for(var i=0;i<G.hist.length;i++){var r=G.hist[i].rid;m[r]=(m[r]||0)+1;}return m;}
function isThisWeek(d){
  var now=new Date(),mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7));mon.setHours(0,0,0,0);
  return d>=mon;
}

/* ── 오디오 ────────────────────────── */
var _ac=null;
/* iOS는 사용자 터치 중에 생성/재개된 AudioContext만 소리를 냄 */
function ensureAudio(){
  try{
    if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();
    if(_ac.state==="suspended")_ac.resume();
  }catch(e){}
}
document.addEventListener("touchstart",ensureAudio,{passive:true});
document.addEventListener("click",ensureAudio);
function beep(f,d,g){
  try{
    if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();
    var o=_ac.createOscillator(),gn=_ac.createGain();
    o.connect(gn);gn.connect(_ac.destination);
    o.frequency.value=f||880;
    gn.gain.setValueAtTime(g||.3,_ac.currentTime);
    gn.gain.exponentialRampToValueAtTime(.001,_ac.currentTime+(d||.1));
    o.start();o.stop(_ac.currentTime+(d||.1));
  }catch(e){}
}

/* ── 화면 꺼짐 방지 (운동 중) ─────── */
var _wl=null;
function reqWL(){
  try{
    if(navigator.wakeLock&&!_wl){
      navigator.wakeLock.request("screen").then(function(w){
        _wl=w;
        w.addEventListener("release",function(){_wl=null;});
      }).catch(function(){});
    }
  }catch(e){}
}
function relWL(){try{if(_wl){_wl.release();_wl=null;}}catch(e){}}

/* ── 탭 ───────────────────────────── */
function nav(i){
  G.tab=i;
  var views=["home","routines","history"];
  G.view=views[i];
  setTab(i);
  draw();
}
function setTab(i){
  for(var j=0;j<3;j++){
    var btn=document.getElementById("tb"+j);
    if(!btn)continue;
    var svg=btn.querySelector("svg");
    var sp=btn.querySelector("span");
    if(j===i){
      if(svg)svg.setAttribute("stroke","var(--red)");
      if(sp)sp.style.color="var(--red)";
    } else {
      if(svg)svg.setAttribute("stroke","var(--t3)");
      if(sp)sp.style.color="var(--t3)";
    }
  }
}

/* ── 렌더 ─────────────────────────── */
function draw(){
  var app=document.getElementById("app");
  if(!app)return;
  app.innerHTML="";
  app.style.paddingBottom="78px";
  var el;
  if(G.view==="home")el=pHome();
  else if(G.view==="routines")el=pRoutines();
  else if(G.view==="detail")el=pDetail();
  else if(G.view==="session")el=pSession();
  else if(G.view==="history")el=pHistory();
  else el=pHome();
  app.appendChild(el);
}

    h+="<h1 style='font-size:26px;font-weight:700;line-height:1.2;letter-spacing:-.3px'>";

  } else {
    h+="<h1 style='font-size:26px;font-weight:700;line-height:1.2;color:var(--t2)'>오늘은 휴식일이에요</h1>";
  }

  h+="<div style='width:44px;height:44px;background:var(--c2);border:1px solid var(--b1);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0'>🏋️</div>";
  h+="</div>";

  /* 통계 */
  var stats=[{v:tot(),l:"총 운동",e:"🔥"},{v:wkCnt(),l:"이번 주",e:"📅"},{v:streak(),l:"연속",e:"⚡"}];
  h+="<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px'>";
  for(var i=0;i<stats.length;i++){
    h+="<div class='cd' style='padding:14px 8px;text-align:center'>";

    h+="<p style='font-size:24px;font-weight:700;line-height:1'>"+stats[i].v+"</p>";
    h+="<p class='mono' style='font-size:8px;color:var(--t3);margin-top:4px'>"+stats[i].l+"</p>";
    h+="</div>";
  }
  h+="</div>";

  /* 주간 바 */
  h+="<div class='cd' style='padding:16px;margin-bottom:18px'>";

/* 타이머 */
function runEl(){
  var s=G.ses;if(!s||s.fin)return;
  if(s.ei)clearInterval(s.ei);
  s.ei=setInterval(function(){
    s.el++;
    var el=document.getElementById("et");
    if(el)el.textContent=fmt(s.el);
  },1000);
}
function runRest(){
  var s=G.ses;if(s.ri)clearInterval(s.ri);
  if(!s.rest||s.rest<=0){s.ri=null;return;}
  s.ri=setInterval(function(){
    if(s.rest<=0){clearInterval(s.ri);s.ri=null;updRest(0);beep(900,.18,.5);return;}
    s.rest--;
    if(s.rest<=10)beep(880,.07,.25);
    if(s.rest===0){clearInterval(s.ri);s.ri=null;setTimeout(function(){beep(900,.18,.5);},150);}
    updRest(s.rest);
  },1000);
}
function updRest(rv){
  var ban=document.getElementById("rb");
  var val=document.getElementById("rv");
  var lbl=document.getElementById("rl");
  var btn=document.getElementById("mb");
  if(!ban)return;
  if(rv<=0){
    ban.style.display="none";
    if(btn){btn.style.background="var(--red)";btn.style.color="#fff";btn.style.cursor="pointer";btn.textContent="✓  세트 완료";}
  } else {
    ban.style.display="flex";
    ban.style.background=rv<=10?"rgba(255,56,96,.14)":"rgba(255,56,96,.08)";
    ban.style.borderColor=rv<=10?"rgba(255,56,96,.55)":"rgba(255,56,96,.2)";
    if(val)val.textContent=fmt(rv);
    if(lbl){lbl.textContent=rv<=10?"⚡ GO SOON":"REST";lbl.style.animation=rv<=10?"blink .7s infinite":"";}
    if(btn){btn.style.background="var(--c3)";btn.style.color="var(--t3)";btn.style.cursor="not-allowed";btn.textContent="↺  REST "+fmt(rv);}
  }
}
function skipRest(){var s=G.ses;if(s.ri){clearInterval(s.ri);s.ri=null;}s.rest=0;updRest(0);}

function doSet(){
  var s=G.ses;var r=s.r;if(s.rest>0)return;
  ensureAudio();
  var ex=r.ex[s.xi];
  s.done[s.xi+":"+s.sn]=true;
  if(s.sn<ex.s){
    s.sn++;s.rest=ex.rest;saveSes();draw();runRest();
  } else if(s.xi<r.ex.length-1){
    s.xi++;s.sn=1;s.rest=120;saveSes();draw();runRest();
  } else {
    clearInterval(s.ei);if(s.ri)clearInterval(s.ri);s.fin=true;
    relWL();
    localStorage.removeItem(SK_SES);
    var ts=0;for(var i=0;i<r.ex.length;i++)ts+=r.ex[i].s;
    G.hist.push({rid:r.id,date:new Date().toISOString(),duration:fmt(s.el),totalSets:ts,elapsed:s.el});
    sh(G.hist);G.ct=ctMap();draw();
  }
}

function jump(i){
  var s=G.ses;var r=s.r;if(i===s.xi)return;
  if(s.ri){clearInterval(s.ri);s.ri=null;}
  var ns=1;
  for(var ss=r.ex[i].s;ss>=1;ss--){if(s.done[i+":"+ss]){ns=(ss<r.ex[i].s?ss+1:ss);break;}}
  s.xi=i;s.sn=ns;
  s.rest=0; /* 수동 이동 시 강제 휴식 없음 */
  saveSes();draw();
}

function adjKg(d){
  var s=G.ses;var ex=s.r.ex[s.xi];
  if(ex.kg===0)return;
  var step=ex.db?2:(ex.sl?2.5:5);
  var maxKg=ex.db?32:999;
  var nv=ex.kg+d;
  if(nv<0)nv=0;
  if(nv>maxKg)nv=maxKg;
  ex.kg=nv;
  var el=document.getElementById("kgCount");
  if(el)el.textContent=nv;
  saveEx();
}

function adjSets(d){
  var s=G.ses;var ex=s.r.ex[s.xi];
  var nv=ex.s+d;
  if(nv<1||nv>10)return;
  ex.s=nv;
  /* 현재 세트번호가 새 총세트 초과하면 조정 */
  if(s.sn>nv)s.sn=nv;
  var el=document.getElementById("setCount");
  if(el)el.textContent=nv;
  /* SET 표시 업데이트 */
  var setDisp=document.querySelectorAll("[id^='setDisp']");
  /* 도트 영역 다시 그리기 */
  var dotWrap=document.getElementById("dotWrap");
  if(dotWrap){
    var r=s.r;var ac=r.ac;
    var dots="";
    for(var i=0;i<nv;i++){
      var sd=s.done[s.xi+":"+(i+1)];var act=(i+1===s.sn);
      dots+="<div style='flex:1;max-width:54px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;";
      dots+="background:"+(sd?ac:(act?ac+"1a":"var(--c2)"))+";";

      dots+="<span style='font-size:15px;font-weight:700;color:"+(sd?"#000":(act?ac:"var(--t3)"))+";letter-spacing:-.3px'>"+(sd?"✓":(i+1))+"</span></div>";
    }
    dotWrap.innerHTML=dots;
  }
  /* 남은 세트 표시 업데이트 */
  var remEl=document.getElementById("remSets");
  if(remEl)remEl.textContent=(nv-s.sn+1)+"세트";
  saveEx();

function adjReps(d){

function adjRest(d){

  /* RD 원본에도 반영하여 다음 세션에서도 유지 */
  for(var i=0;i<RD.length;i++){
    if(RD[i].id===s.r.id){
      RD[i].ex[s.xi].rest=nv;
      break;
    }
  }
  saveEx();
}

var SK_REST="lift5_rest";
/* 구버전 키 마이그레이션용 로더 */
function loadRest(){
  try{
    var m=JSON.parse(localStorage.getItem(SK_REST)||"null");
    if(!m)return;
    for(var i=0;i<RD.length;i++){
      var r=RD[i];
      for(var j=0;j<r.ex.length;j++){
        var v=m[r.id+":"+j];
        if(v!==undefined)r.ex[j].rest=v;
      }
    }
  }catch(e){}
}

/* ── 전역 핸들러 ─────────────────── */
function goDetail(i){G.sel=RD[i];G.view="detail";draw();}
function back(){G.view=(G.tab===0?"home":G.tab===1?"routines":"history");draw();}
function goHome(){G.ses=null;relWL();var tb=document.getElementById("tab");if(tb)tb.style.display="flex";G.tab=0;G.view="home";setTab(0);draw();}

/* ── 초기화 ──────────────────────── */
function initApp(){
  loadKg();
  loadRest();
  loadEx();
  var saved=loadSes();
  if(saved){
    G.ses=saved;
    G.view="session";
    var tb=document.getElementById("tab");
    if(tb)tb.style.display="none";
    draw();
    if(G.ses.rest>0)runRest();
    reqWL();
  } else {
    setTab(0);draw();
  }
}
window.onload=function(){initApp();};

/* pageshow: 안드로이드 앱 전환 후 복귀 시 BFCache에서 복원될 때도 실행 */
window.addEventListener("pageshow",function(e){
  if(e.persisted){
    /* BFCache 복원 — 상태 재초기화 */
    G.ses=null;
    initApp();
  }
});

var _hiddenAt=0;
document.addEventListener("visibilitychange",function(){
  if(document.hidden){
    _hiddenAt=Date.now();
    saveSes();saveEx();
    /* 타이머 정지 — 복귀 시 경과시간을 일괄 보정하므로 백그라운드 틱과 이중계산 방지 */
    var s=G.ses;
    if(s&&!s.fin){
      if(s.ei){clearInterval(s.ei);s.ei=null;}
      if(s.ri){clearInterval(s.ri);s.ri=null;}
    }
  } else {
    /* visibilitychange로 돌아온 경우 (페이지 reload 없이) */
    if(G.ses&&!G.ses.fin&&G.view==="session"){
      if(_hiddenAt>0){
        var away=Math.floor((Date.now()-_hiddenAt)/1000);
        G.ses.el+=away;
        if(G.ses.rest>0)G.ses.rest=Math.max(0,G.ses.rest-away);
        _hiddenAt=0;
      }
      if(G.ses.rest>0)runRest();else updRest(0);
      runEl();
      var et=document.getElementById("et");
      if(et)et.textContent=fmt(G.ses.el);
      reqWL();
    } else if(!G.ses){
      /* 세션 없을 때 돌아온 경우 — localStorage 재확인 */
      var saved=loadSes();
      if(saved){
        G.ses=saved;G.view="session";
        var tb=document.getElementById("tab");
        if(tb)tb.style.display="none";
        draw();
        if(G.ses.rest>0)runRest();
        reqWL();
      }
    }
  }
});
window.addEventListener("pagehide",function(){saveSes();saveEx();});
window.addEventListener("beforeunload",function(){saveSes();saveEx();});

/* ── PWA 서비스 워커 등록 ─────────── */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(e){});
  });
}
</script>
